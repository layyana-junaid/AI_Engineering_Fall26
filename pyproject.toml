[project]
name = "minigpt-from-scratch"
version = "1.0.0"
description = "A small GPT-style causal language model built from scratch in PyTorch"
requires-python = ">=3.9"
dependencies = ["torch>=2.0", "numpy", "pyyaml", "matplotlib"]

[project.optional-dependencies]
api = ["fastapi", "uvicorn", "httpx"]
dev = ["pytest"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
